# dvoid (org-specific) — build a Pomerium image from THIS fork's deploy/production
# (= upstream main + patch/* + local/*) and push it to ghcr.io/dvoid-io/pomerium.
# Railway pulls the image directly (image source + registry credentials), the
# same lane as ghcr.io/dvoid-io/affine. Building from the fork is the point: it
# carries patch/fetch-metadata-redirect until upstream ships the equivalent.
# Uses upstream's own Dockerfile unchanged (UI build + Go build + embedded
# Envoy), single linux/amd64 for Railway.
#
# The image is built only after the fork's own tests pass: every Go package a
# patch/* or local/* branch changes, tested whole. Upstream's suite is upstream's
# to keep green; what only this fork can break is what its branches touch.
#
# Lives on local/ci-image-build; reaches deploy/production via rebuild-deploy
# (estate-ops/docs/UPSTREAM-SYNC.md). Never goes upstream.
name: dvoid · Build Pomerium image

on:
  push:
    branches: [deploy/production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fork-tests:
    name: Test the fork's own packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # .tool-versions, not go.mod: go.mod's `go` line is a minimum, while
      # .tool-versions pins the toolchain the Dockerfile's builder stage uses.
      - uses: actions/setup-go@v5
        with:
          go-version-file: .tool-versions
          cache: true
      # rebuild-deploy builds deploy/production as origin/<mirror> plus one
      # `--no-ff` merge per branch titled "merge <branch> into deploy/production",
      # so the mirror is the first commit on the first-parent chain without that
      # title. Everything after it is the fork's.
      - name: Find the packages the fork changes
        id: pkgs
        run: |
          set -euo pipefail
          mirror="$(git log --first-parent -1 --format=%H --invert-grep \
            -E --grep='^merge (patch|local)/.+ into deploy/production$' HEAD)"
          pkgs="$(git diff --name-only "$mirror" HEAD -- '*.go' | xargs -r -n1 dirname | sort -u |
            while read -r d; do compgen -G "$d/*_test.go" >/dev/null && echo "./$d"; done | paste -sd' ')"
          echo "mirror: $(git log -1 --format='%h %s' "$mirror")"
          echo "packages: ${pkgs:-none}"
          # A gate that tests nothing must not pass as one: no package means the
          # mirror was not found, or the fork no longer carries Go changes.
          [[ -n "$pkgs" ]] || { echo "::error::no fork package to test — see above"; exit 1; }
          echo "list=$pkgs" >> "$GITHUB_OUTPUT"
      # authorize and authenticateflow embed the Envoy binary (pkg/envoy/files).
      - run: make get-envoy
      - run: go test -count=1 ${{ steps.pkgs.outputs.list }}

  build-image:
    name: Build & push ghcr.io/dvoid-io/pomerium
    needs: fork-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # upstream's Dockerfile COPYs .git for version stamping
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/dvoid-io/pomerium:deploy-production
            ghcr.io/dvoid-io/pomerium:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
